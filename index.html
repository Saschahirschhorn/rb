<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Regiebericht</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Regiebericht">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
/* Öffentlich ist nur diese Anmeldeseite. Die App selbst liegt geschützt bei Supabase und kommt erst nach der Anmeldung. */
:root{--bg:#efe9e1;--paper:#fffdf9;--ink:#2a2420;--muted:#776b60;--line:#dcd1c3;--accent:#8f6a43;--accent-ink:#fffdf9;--warn:#9a5b12;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1c1814;--paper:#27211c;--ink:#efe7dd;--muted:#a99b8c;--line:#3d342c;--accent:#d1a676;--accent-ink:#1c1814;--warn:#f0b56a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
form{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:20px}
label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:7px;padding:12px 16px;cursor:pointer}
button:disabled{opacity:.5}
.hint{font-size:13px;color:var(--muted)}
.fehler{color:var(--warn);font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="laden" class="hint">Wird geladen …</div>
<form id="anmelden" hidden autocomplete="on">
  <h1>Regiebericht</h1>
  <div class="hint">Anmelden mit Kürzel oder E-Mail-Adresse.</div>
  <div><label for="name">Kürzel oder E-Mail</label><input id="name" name="username" autocomplete="username" autocapitalize="none" required></div>
  <div><label for="pw">Passwort</label><input id="pw" name="password" type="password" autocomplete="current-password" required></div>
  <button type="submit">Anmelden</button>
  <div class="fehler" id="fehler" hidden></div>
</form>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
/* Öffentlicher Schlüssel: gibt nur das frei, was die Datenbank-Regeln einem Angemeldeten erlauben */
const sb=supabase.createClient('https://xjglgphkbnuhyrxavhtp.supabase.co','sb_publishable_s8V5irVcqm5o9lbsTY5vNg_eB_35Rgj');
const $=id=>document.getElementById(id);
function formular(meldung){
  $('laden').hidden=true;$('anmelden').hidden=false;
  $('fehler').hidden=!meldung;$('fehler').textContent=meldung||'';
}
/* App aus dem geschützten Speicher holen; klappt nur für freigeschaltete Mitglieder */
async function appLaden(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user){formular();return;}
  $('laden').hidden=false;$('anmelden').hidden=true;
  const {data,error}=await sb.storage.from('app').download('app.html');
  if(error||!data){await sb.auth.signOut();formular('Dein Zugang ist noch nicht freigeschaltet. Bitte im Büro Bescheid geben.');return;}
  const html=await data.text();
  document.open();document.write(html);document.close();
}
$('anmelden').addEventListener('submit',async e=>{
  e.preventDefault();
  const n=$('name').value.trim(),pw=$('pw').value;
  const email=n.includes('@')?n:n.toLowerCase()+'@mitarbeiter.invalid';
  const b=e.target.querySelector('button');b.disabled=true;
  const {error}=await sb.auth.signInWithPassword({email,password:pw});
  b.disabled=false;
  if(error){formular('Anmeldung hat nicht geklappt. Kürzel und Passwort prüfen.');return;}
  appLaden();
});
appLaden().catch(()=>formular('Keine Verbindung. Bitte später nochmal versuchen.'));
})();
</script>
</body>
</html>
